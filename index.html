<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight Employees — Wawasan untuk Karyawan Indonesia</title>
<meta name="description" content="Insight Employees menyajikan artikel seputar K3, produktivitas, hukum ketenagakerjaan, dan pengembangan diri untuk karyawan dan pekerja di seluruh Indonesia.">
<style>
:root{
  --steel-900:#141B23;
  --steel-800:#1C2530;
  --steel-700:#2A3744;
  --steel-600:#3C4B59;
  --paper:#EEF0EC;
  --paper-card:#FFFFFF;
  --ink:#1C2530;
  --ink-muted:#5C6470;
  --line:#DDE1DA;
  --amber:#F2A93C;
  --amber-ink:#7A4E0A;
  --hazard:#FFC233;
  --k3:#D6492F;
  --produktivitas:#2C6E9E;
  --hukum:#5B4B8A;
  --diri:#3F8F5F;
  --radius:6px;
  --shadow-sm:0 1px 2px rgba(20,27,35,.10);
  --shadow-md:0 8px 22px rgba(20,27,35,.12);
  --font-display:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"Courier New",monospace;
  --font-body:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(135deg, rgba(28,37,48,.028) 0 1px, transparent 1px 23px),
    repeating-linear-gradient(45deg, rgba(28,37,48,.022) 0 1px, transparent 1px 23px);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;}
.hazard-strip{
  height:6px;width:100%;flex-shrink:0;
  background:repeating-linear-gradient(125deg, var(--hazard) 0 16px, var(--steel-900) 16px 32px);
}
.steel-texture{
  background-image:repeating-linear-gradient(123deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px);
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:600;
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--steel-800);
  border-bottom:1px solid var(--steel-700);
}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;max-width:1120px;margin:0 auto;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;color:#fff;}
.brand-mark{
  width:34px;height:34px;border-radius:4px;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:800;color:var(--steel-900);font-size:15px;
  flex-shrink:0;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text strong{font-size:16.5px;font-weight:800;letter-spacing:-.01em;}
.brand-text span{font-family:var(--font-mono);font-size:10.5px;color:#9FAAB5;letter-spacing:.06em;text-transform:uppercase;}
.topnav{display:flex;align-items:center;gap:4px;}
.topnav a, .topnav button{
  color:#C9D0D6;background:transparent;border:none;
  font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:4px;
}
.topnav a:hover, .topnav button:hover{background:var(--steel-700);color:#fff;}
.topnav .active{background:var(--steel-700);color:#fff;}
.search-mini{display:flex;align-items:center;background:var(--steel-700);border-radius:4px;padding:0 4px 0 10px;}
.search-mini input{
  background:transparent;border:none;color:#fff;padding:8px 4px;font-size:13.5px;width:130px;outline:none;
}
.search-mini input::placeholder{color:#8E99A4;}
.search-mini button{background:transparent;border:none;color:#C9D0D6;padding:8px;font-size:14px;}
@media(max-width:760px){
  .topnav span.nav-label{display:none;}
  .search-mini input{width:90px;}
}
@media(max-width:480px){
  .topnav .add-label{display:none;}
}

/* ============ HERO ============ */
.hero{
  background:
    repeating-linear-gradient(123deg, rgba(255,255,255,.022) 0 2px, transparent 2px 7px),
    linear-gradient(165deg,var(--steel-900),var(--steel-800) 60%);
  color:#fff;position:relative;overflow:hidden;
  padding:56px 0 64px;
}
.hero::after{
  content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;
  background:radial-gradient(circle,rgba(242,169,60,.18),transparent 70%);
}
.hero-inner{max-width:1120px;margin:0 auto;padding:0 20px;position:relative;}
.hero-eyebrow{color:var(--amber);display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
.hero-title{
  font-size:clamp(28px,4.4vw,46px);font-weight:800;letter-spacing:-.02em;
  margin:0 0 16px;max-width:760px;
}
.hero-excerpt{color:#B9C2CA;font-size:16px;max-width:580px;margin:0 0 26px;}
.hero-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:4px;font-weight:700;font-size:14px;border:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-amber{background:var(--amber);color:var(--steel-900);}
.btn-amber:hover{box-shadow:0 4px 14px rgba(242,169,60,.35);}
.btn-ghost{background:transparent;color:#fff;border:1px solid var(--steel-600);}
.btn-ghost:hover{background:var(--steel-700);}
.btn-dark{background:var(--steel-800);color:#fff;}
.btn-dark:hover{background:var(--steel-700);}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink-muted);}
.btn-danger{background:#fff;color:var(--k3);border:1px solid var(--k3);}
.btn-danger:hover{background:var(--k3);color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.hero-tag-chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  padding:5px 10px;border-radius:3px;color:#fff;
}

/* ============ CATEGORY STRIP ============ */
.cat-strip{
  background:var(--paper-card);border-bottom:1px solid var(--line);
  position:sticky;top:63px;z-index:30;
}
.cat-strip-inner{
  max-width:1120px;margin:0 auto;padding:12px 20px;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
}
.cat-strip-inner::-webkit-scrollbar{display:none;}
.cat-pill{
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink-muted);background:#fff;flex-shrink:0;
}
.cat-pill .cat-dot{width:8px;height:8px;border-radius:50%;}
.cat-pill.active{background:var(--steel-800);color:#fff;border-color:var(--steel-800);}
.cat-pill.active .cat-dot{box-shadow:0 0 0 2px rgba(255,255,255,.25);}

/* ============ ARTICLE GRID / TAG CARDS ============ */
.section-pad{padding:42px 0 60px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
.section-head h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0;}
.section-head .count{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);}

.article-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;
}
.tag-card{
  position:relative;background:var(--paper-card);border:1px solid var(--line);
  border-radius:var(--radius);padding:30px 18px 18px;box-shadow:var(--shadow-sm);
  transition:transform .22s ease, box-shadow .22s ease;display:flex;flex-direction:column;gap:10px;
}
.tag-card:hover{transform:rotate(-0.6deg) translateY(-3px);box-shadow:var(--shadow-md);}
.tag-card:focus-within{outline:2px solid var(--amber);outline-offset:2px;}
.tag-hole{
  position:absolute;top:13px;left:16px;width:11px;height:11px;border-radius:50%;
  background:var(--paper);box-shadow:inset 0 0 0 1.5px #C7CBC2, 0 1px 1px rgba(0,0,0,.12);
}
.tag-stripe{position:absolute;top:0;left:0;right:0;height:5px;border-radius:var(--radius) var(--radius) 0 0;}
.tag-meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-muted);display:flex;justify-content:space-between;gap:8px;}
.tag-card h3{font-size:17px;font-weight:800;line-height:1.32;margin:0;letter-spacing:-.005em;}
.tag-card p{font-size:13.5px;color:var(--ink-muted);margin:0;flex:1;}
.tag-card .tag-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-muted);margin-top:4px;}
.tag-card .read-link{font-weight:700;color:var(--steel-800);font-size:13px;}
.cat-label{font-weight:700;}
.empty-state{
  border:1px dashed var(--line);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--ink-muted);
  background:var(--paper-card);
}
.empty-state h3{color:var(--ink);margin:0 0 6px;}

/* ============ ARTICLE DETAIL ============ */
.detail-wrap{max-width:720px;margin:0 auto;padding:44px 20px 70px;}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-muted);margin-bottom:22px;}
.detail-back:hover{color:var(--ink);}
.detail-tagrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.detail-title{font-size:clamp(24px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;margin:0 0 14px;}
.detail-meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line);}
.detail-summary{font-size:17px;color:var(--steel-700);font-weight:600;margin:0 0 24px;line-height:1.55;}
.detail-body p{font-size:16px;margin:0 0 18px;color:#2B3742;}
.detail-body img{max-width:100%;height:auto;border-radius:6px;margin:18px 0;display:block;}
.detail-body h2{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:32px 0 14px;}
.detail-body h3{font-size:19px;font-weight:800;margin:26px 0 10px;}
.detail-body blockquote{border-left:3px solid var(--amber);padding-left:16px;margin:22px 0;color:var(--ink-muted);font-style:italic;}
.detail-body ul, .detail-body ol{margin:0 0 18px;padding-left:22px;}
.detail-body li{margin-bottom:7px;font-size:16px;}

/* ---- rich text editor ---- */
.editor-toolbar{
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px;
  background:var(--paper);border:1px solid var(--line);border-bottom:none;border-radius:5px 5px 0 0;
}
.editor-toolbar select{
  border:1px solid var(--line);border-radius:4px;padding:6px 7px;font-size:12.5px;background:#fff;color:var(--ink);max-width:130px;
}
.editor-toolbar button{
  border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 10px;font-size:13px;font-weight:700;
  color:var(--ink);min-width:30px;line-height:1;
}
.editor-toolbar button:hover{background:#fff;border-color:var(--steel-700);}
.ed-upload-btn{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:4px;
  padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1;
}
.ed-upload-btn:hover{border-color:var(--steel-700);}
.editor-toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 3px;}
.editor-content{
  min-height:280px;border:1px solid var(--line);border-radius:0 0 5px 5px;
  padding:16px 18px;font-size:15.5px;line-height:1.75;background:#fff;outline:none;overflow-y:auto;color:#2B3742;
}
.editor-content:focus{border-color:var(--steel-700);}
.editor-content img{max-width:100%;height:auto;border-radius:5px;margin:10px 0;display:block;}
.editor-content p{margin:0 0 14px;}
.editor-content blockquote{border-left:3px solid var(--amber);padding-left:14px;color:var(--ink-muted);margin:14px 0;font-style:italic;}
.editor-content h2{font-size:21px;font-weight:800;margin:16px 0 10px;}
.editor-content h3{font-size:17px;font-weight:800;margin:14px 0 8px;}
.editor-content ul, .editor-content ol{padding-left:22px;margin:0 0 14px;}
.related-head{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:46px 0 14px;}

/* ---- media embeds & references ---- */
.yt-embed{position:relative;width:100%;padding-top:56.25%;margin:8px 0 22px;border-radius:var(--radius);overflow:hidden;background:#000;}
.yt-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.ref-box{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:24px 0;}
.ref-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.ref-list a{font-size:13.5px;font-weight:700;color:var(--steel-700);}
.ref-list a:hover{color:var(--produktivitas);}

/* ---- share bar ---- */
.share-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:26px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

/* ---- like button ---- */
.like-btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--paper-card);border:1px solid var(--line);
  border-radius:20px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--ink-muted);transition:transform .15s ease, border-color .15s ease;
}
.like-btn:hover{border-color:var(--k3);transform:scale(1.03);}
.like-btn.liked{border-color:var(--k3);color:var(--k3);background:#FBEEEA;}
.like-row{display:flex;align-items:center;gap:14px;margin:18px 0 8px;}

/* ---- comments ---- */
.comments-section{margin-top:18px;}
.comment-list{display:flex;flex-direction:column;gap:14px;margin-bottom:22px;}
.comment-item{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.comment-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
.comment-head strong{font-size:13.5px;}
.comment-head span{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}
.comment-item p{margin:0;font-size:14px;color:#2B3742;}
.comment-form{display:flex;flex-direction:column;gap:10px;background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.comment-form input, .comment-form textarea{border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:14px;outline:none;}
.comment-form input:focus, .comment-form textarea:focus{border-color:var(--steel-700);}
.comment-form button{align-self:flex-start;}
.comment-list-admin{display:flex;flex-direction:column;gap:10px;}
.admin-comment-row{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;}
.admin-comment-row .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted);margin-bottom:4px;}
.admin-comment-row p{margin:0;font-size:13.5px;}

/* ============ FOOTER ============ */
footer{background:var(--steel-900);color:#9FAAB5;padding:0 0 26px;margin-top:40px;overflow:hidden;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px;max-width:1120px;margin:0 auto;padding:44px 20px 0;}
.footer-grid h4{color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-mono);margin:0 0 14px;}
.footer-grid p{font-size:13.5px;line-height:1.7;max-width:320px;}
.footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
.footer-grid a{font-size:13.5px;}
.footer-grid a:hover{color:#fff;}
.footer-bottom{max-width:1120px;margin:30px auto 0;padding:18px 20px 0;border-top:1px solid var(--steel-700);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
@media(max-width:680px){.footer-grid{grid-template-columns:1fr;}}

/* ============ ADMIN: GATE ============ */
.admin-gate{
  min-height:100vh;background-color:var(--steel-900);
  background-image:repeating-linear-gradient(123deg, rgba(255,255,255,.015) 0 2px, transparent 2px 7px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.gate-card{
  width:100%;max-width:340px;background:var(--steel-800);border:1px solid var(--steel-700);
  border-radius:8px;padding:32px 28px;text-align:center;overflow:hidden;position:relative;
}
.gate-card .hazard-strip{position:absolute;top:0;left:0;right:0;}
.gate-card .brand-mark{margin:18px auto 18px;}
.gate-card h2{color:#fff;font-size:18px;margin:0 0 6px;}
.gate-card p{color:#9FAAB5;font-size:13px;margin:0 0 24px;}
.pin-input{
  width:100%;background:var(--steel-900);border:1px solid var(--steel-600);color:#fff;
  font-family:var(--font-mono);font-size:22px;letter-spacing:.5em;text-align:center;
  padding:14px 10px 14px 18px;border-radius:6px;margin-bottom:14px;outline:none;
}
.pin-input:focus{border-color:var(--amber);}
.gate-error{color:#F08A6E;font-size:12.5px;margin-bottom:12px;min-height:16px;}
.gate-back{display:block;margin-top:18px;color:#7E8A95;font-size:12.5px;}

/* ============ ADMIN SHELL ============ */
.admin-shell{display:flex;min-height:100vh;background:var(--paper);}
.admin-sidebar{
  width:220px;background-color:var(--steel-900);
  background-image:repeating-linear-gradient(123deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px);
  color:#fff;flex-shrink:0;
  display:flex;flex-direction:column;padding:20px 14px;
}
.admin-sidebar .brand{margin-bottom:26px;padding:0 6px;}
.admin-nav{display:flex;flex-direction:column;gap:3px;flex:1;}
.admin-nav button{
  text-align:left;background:transparent;border:none;color:#B9C2CA;padding:10px 12px;
  border-radius:5px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;
}
.admin-nav button:hover{background:var(--steel-700);color:#fff;}
.admin-nav button.active{background:var(--amber);color:var(--steel-900);}
.admin-sidebar .exit-link{color:#7E8A95;font-size:12.5px;padding:10px 12px;border-top:1px solid var(--steel-700);margin-top:10px;}
.admin-sidebar .exit-link:hover{color:#fff;}
.admin-main{flex:1;padding:30px 34px;max-width:980px;}
@media(max-width:820px){
  .admin-shell{flex-direction:column;}
  .admin-sidebar{width:100%;flex-direction:row;align-items:center;overflow-x:auto;padding:12px 14px;}
  .admin-sidebar .brand{margin:0 14px 0 0;}
  .admin-nav{flex-direction:row;}
  .admin-sidebar .exit-link{border-top:none;border-left:1px solid var(--steel-700);}
  .admin-main{padding:22px 18px;}
}
.admin-h1{font-size:21px;font-weight:800;margin:0 0 4px;}
.admin-sub{color:var(--ink-muted);font-size:13.5px;margin:0 0 26px;}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.admin-card h3{margin:0 0 4px;font-size:15px;}
.admin-card .hint{color:var(--ink-muted);font-size:12.5px;margin:0 0 16px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--steel-700);}
.field input[type=text], .field input[type=password], .field input[type=url], .field input[type=number], .field select, .field textarea{
  width:100%;border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:14px;outline:none;background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--steel-700);}
.field textarea{resize:vertical;line-height:1.6;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.field-row{grid-template-columns:1fr;}}
.table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table th{text-align:left;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);padding:9px 10px;border-bottom:1px solid var(--line);}
.table td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
.table tr:last-child td{border-bottom:none;}
.mini-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:10px;color:#fff;}
.row-actions{display:flex;gap:6px;}
.code-display{

const DEFAULT_ARTICLES = [
{id:"a1",code:"TAG-001",category:"k3",title:"5 Kebiasaan Kecil yang Mencegah Kecelakaan Kerja Besar",
 summary:"Sebagian besar kecelakaan kerja dipicu oleh hal-hal sepele yang terlewat. Berikut lima kebiasaan sederhana yang bisa menyelamatkan nyawa.",
 content:"Data dari berbagai laporan keselamatan kerja menunjukkan pola yang sama: kecelakaan besar jarang muncul tiba-tiba. Hampir selalu ada tanda-tanda kecil yang diabaikan sebelumnya, mulai dari lantai licin yang dibiarkan, kabel yang menjuntai, sampai APD yang dilepas \"sebentar saja\". Insight ini berfokus pada lima kebiasaan kecil yang, jika dirawat setiap hari, bisa menutup celah-celah itu sebelum berubah menjadi insiden.\n\nPertama, biasakan inspeksi visual 30 detik sebelum mulai bekerja — cek area sekitar mesin, jalur evakuasi, dan kondisi alat. Kedua, jangan pernah melepas APD meski hanya untuk \"sebentar\", karena kecelakaan tidak pernah memberi peringatan jadwal. Ketiga, laporkan kondisi tidak aman sekecil apa pun, bahkan jika bukan area kerja sendiri. Keempat, jaga jalur evakuasi tetap bebas hambatan setiap saat, bukan hanya saat ada inspeksi. Kelima, istirahat cukup — kelelahan adalah penyebab tersembunyi di balik banyak human error.\n\nKebiasaan ini terlihat sederhana, tapi konsistensi adalah kuncinya. Tim yang menjadikan lima hal ini sebagai rutinitas, bukan formalitas, biasanya punya catatan keselamatan yang jauh lebih baik dalam jangka panjang.",
 author:"Tim Redaksi", date:"2026-06-02", tags:["APD","kebiasaan","pencegahan"]},

{id:"a2",code:"TAG-002",category:"k3",title:"Mengenal APD: Kapan dan Kenapa Wajib Dipakai",
 summary:"Alat Pelindung Diri bukan sekadar aturan administratif. Memahami fungsinya membuat kita lebih disiplin memakainya.",
 content:"Banyak pekerja menganggap Alat Pelindung Diri (APD) sebagai kewajiban administratif yang harus dipenuhi saat ada inspeksi. Padahal setiap jenis APD dirancang untuk risiko spesifik di area kerja masing-masing, dan fungsinya jauh lebih konkret dari sekadar memenuhi checklist.\n\nHelm keselamatan melindungi dari benda jatuh dan benturan di area kerja vertikal. Kacamata pelindung menahan percikan partikel saat proses pemotongan atau pengelasan. Sarung tangan disesuaikan dengan jenis bahaya — tahan panas, tahan bahan kimia, atau tahan sayatan, tidak bisa disamaratakan. Sepatu safety dengan pelindung baja mencegah cedera akibat benda berat, sementara pelindung telinga menjaga pendengaran jangka panjang di area dengan kebisingan tinggi.\n\nMemahami \"kenapa\" di balik setiap APD membuat kepatuhan terasa lebih masuk akal, bukan sekadar formalitas. Saat kita tahu APD itu melindungi bagian tubuh dari risiko nyata yang ada di depan mata, memakainya menjadi pilihan logis, bukan beban.",
 author:"Tim Redaksi", date:"2026-05-26", tags:["APD","edukasi"]},

{id:"a3",code:"TAG-003",category:"produktivitas",title:"Teknik Pomodoro di Lingkungan Pabrik: Bisakah Diterapkan?",
 summary:"Teknik manajemen waktu yang populer di dunia kantor ternyata bisa dimodifikasi untuk ritme kerja shift dan produksi.",
 content:"Teknik Pomodoro — bekerja fokus 25 menit lalu istirahat 5 menit — awalnya dirancang untuk pekerjaan kantor yang fleksibel. Namun prinsip dasarnya, yaitu menjaga fokus dalam interval pendek dan memberi jeda pemulihan, sebenarnya relevan juga untuk pekerjaan yang lebih terstruktur seperti operator produksi atau staf quality control.\n\nModifikasinya sederhana: alih-alih kaku di angka 25 menit, sesuaikan interval dengan siklus kerja yang ada — misalnya antar batch produksi, antar checklist inspeksi, atau antar line changeover. Yang penting bukan angka pastinya, tapi disiplin untuk benar-benar fokus penuh selama interval kerja, dan benar-benar istirahat selama jeda.\n\nPenerapan ini bisa membantu menjaga konsentrasi tetap stabil sepanjang shift, mengurangi kesalahan akibat kelelahan mental, dan membuat waktu istirahat terasa lebih bermakna karena benar-benar digunakan untuk pulih.",
 author:"Tim Redaksi", date:"2026-06-10", tags:["fokus","manajemen waktu"]},

{id:"a4",code:"TAG-004",category:"produktivitas",title:"5 Skill yang Paling Dicari Industri Manufaktur 2026",
 summary:"Otomatisasi mengubah kebutuhan skill di lantai produksi. Ini lima kompetensi yang nilainya terus naik.",
 content:"Industri manufaktur terus bertransformasi seiring masuknya otomatisasi dan sistem digital ke lantai produksi. Ini bukan berarti peran manusia berkurang, tapi jenis skill yang dibutuhkan ikut bergeser.\n\nKemampuan membaca data dasar — seperti memahami dashboard produksi atau laporan kualitas — kini jadi nilai tambah di hampir semua posisi. Kemampuan troubleshooting dasar pada mesin semi-otomatis juga semakin dicari, karena downtime kecil yang bisa ditangani cepat menghemat banyak biaya. Selain itu, komunikasi lintas shift, kedisiplinan dokumentasi, kemampuan bekerja lintas departemen, dan kemauan terus belajar sistem baru menjadi pembeda utama.\n\nKabar baiknya, sebagian besar skill ini bisa dipelajari sambil jalan — lewat pelatihan internal, mentoring dari senior, atau inisiatif belajar mandiri. Yang dibutuhkan terutama adalah kemauan untuk tidak berhenti di zona nyaman.",
 author:"Tim Redaksi", date:"2026-06-15", tags:["skill","manufaktur","karier"]},

{id:"a5",code:"TAG-005",category:"hukum",title:"Hak Cuti Karyawan yang Sering Tidak Diketahui",
 summary:"Selain cuti tahunan, ada beberapa jenis cuti yang diatur regulasi namun jarang dipahami pekerja.",
 content:"Sebagian besar pekerja hanya familier dengan cuti tahunan. Padahal regulasi ketenagakerjaan di Indonesia mengatur beberapa jenis cuti dan izin lain yang juga merupakan hak pekerja, meski penerapan detailnya bisa berbeda tergantung kebijakan perusahaan dan perjanjian kerja yang berlaku.\n\nDi antaranya adalah cuti haid bagi pekerja perempuan apabila merasa sakit pada hari pertama dan kedua, izin tidak masuk kerja karena pernikahan, kematian anggota keluarga inti, atau istri melahirkan/keguguran, yang biasanya tetap dibayar sesuai ketentuan perusahaan. Ada juga hak cuti melahirkan bagi pekerja perempuan dengan durasi yang diatur khusus.\n\nKarena ketentuan detail seperti jumlah hari dan prosedur pengajuan bisa bervariasi antar perusahaan, langkah paling aman adalah selalu mengecek peraturan perusahaan atau perjanjian kerja bersama (PKB) di tempat kerja masing-masing, dan tidak ragu bertanya ke HR jika ada hal yang kurang jelas.",
 author:"Tim Redaksi", date:"2026-05-30", tags:["cuti","hak pekerja"]},

{id:"a6",code:"TAG-006",category:"hukum",title:"Memahami Perbedaan PKWT dan PKWTT",
 summary:"Status kontrak kerja menentukan banyak hak pekerja. Berikut perbedaan mendasar yang penting diketahui.",
 content:"PKWT (Perjanjian Kerja Waktu Tertentu) dan PKWTT (Perjanjian Kerja Waktu Tidak Tertentu) adalah dua status kerja yang paling umum ditemui, namun masih sering tertukar pemahamannya oleh pekerja baru.\n\nPKWT berlaku untuk jangka waktu atau jenis pekerjaan tertentu yang sifatnya tidak tetap, seperti proyek musiman atau pekerjaan sementara, dengan batas waktu yang jelas di awal perjanjian. PKWTT, di sisi lain, tidak memiliki batas waktu dan umumnya diawali masa percobaan maksimal tiga bulan sebelum berstatus tetap. Perbedaan status ini berpengaruh pada mekanisme pengakhiran hubungan kerja dan kompensasi yang berlaku.\n\nBagi pekerja, penting membaca isi perjanjian kerja dengan teliti sejak awal, termasuk status PKWT atau PKWTT, durasi, dan klausul-klausul lain di dalamnya. Jika ada klausul yang terasa janggal, menanyakannya ke HR sebelum tanda tangan jauh lebih baik daripada menyesal belakangan.",
 author:"Tim Redaksi", date:"2026-06-08", tags:["kontrak kerja","regulasi"]},

{id:"a7",code:"TAG-007",category:"diri",title:"Cara Bangkit Setelah Gagal Promosi Jabatan",
 summary:"Tidak terpilih untuk promosi bukan akhir dari perjalanan karier. Begini cara memprosesnya dengan sehat.",
 content:"Gagal mendapatkan promosi yang sudah dipersiapkan dan dinanti-nanti rasanya berat. Wajar jika muncul kekecewaan, bahkan sempat mempertanyakan nilai diri sendiri. Namun bagaimana momen ini direspons sering kali lebih menentukan arah karier ke depan dibanding hasil promosi itu sendiri.\n\nLangkah pertama yang membantu adalah memberi diri waktu untuk kecewa, tanpa buru-buru menutupinya dengan sikap \"baik-baik saja\". Setelah itu, cari kejelasan: minta feedback spesifik ke atasan tentang apa yang menjadi pertimbangan, bukan untuk membela diri, tapi untuk benar-benar memahami area yang perlu dikembangkan. Hindari membandingkan diri secara berlebihan dengan rekan yang terpilih.\n\nGunakan momentum ini untuk menyusun rencana pengembangan yang konkret, bukan sekadar menunggu kesempatan berikutnya datang sendiri. Karier yang berkelanjutan biasanya dibangun dari respons terhadap kegagalan, bukan dari rangkaian keberhasilan tanpa hambatan.",
 author:"Tim Redaksi", date:"2026-06-12", tags:["karier","motivasi"]},

{id:"a8",code:"TAG-008",category:"diri",title:"Membangun Reputasi Baik di Tempat Kerja, Dimulai dari Hal Kecil",
 summary:"Reputasi profesional tidak dibangun dari satu momen besar, tapi dari konsistensi hal-hal kecil setiap hari.",
 content:"Reputasi di tempat kerja sering dianggap sebagai sesuatu yang dibangun lewat pencapaian besar atau proyek yang mencolok. Padahal, persepsi rekan kerja dan atasan terhadap seseorang lebih sering terbentuk dari pola perilaku kecil yang berulang setiap hari.\n\nDatang tepat waktu secara konsisten, menepati janji sekecil apa pun, merespons pesan kerja dengan wajar tanpa berlarut-larut, dan mengakui kesalahan tanpa mencari kambing hitam adalah contoh kebiasaan kecil yang terakumulasi menjadi citra \"bisa diandalkan\" dari waktu ke waktu.\n\nReputasi baik memang butuh waktu untuk dibangun, tapi nilainya bertahan lama dan sering menjadi faktor penentu saat ada kesempatan baru yang muncul — promosi, proyek penting, atau sekadar dipercaya memegang tanggung jawab lebih besar.",
 author:"Tim Redaksi", date:"2026-06-18", tags:["reputasi","etos kerja"]}
];

/* ============================= STATE ============================= */
let state = {
  articles: [],
  route: "home",
  routeParam: null,
  activeCategory: "all",
  searchQuery: "",
  adminLoggedIn: false,
  adminView: "dashboard",
  editingId: null,
  syncStatus: "idle", // idle | syncing | ok | error
  likes: {},
  comments: {},
  allComments: [],
  commentsNeedsFetch: false
};

/* ============================= STORAGE ============================= */
function loadArticles(){
  try{
    const raw = localStorage.getItem("ie_articles");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return DEFAULT_ARTICLES.slice();
}
function saveArticlesLocal(articles){
  localStorage.setItem("ie_articles", JSON.stringify(articles));
}
function getSettings(){
  let s = {};
  try{ s = JSON.parse(localStorage.getItem("ie_settings") || "{}"); }catch(e){}
  return {
    geminiKey: s.geminiKey || "",
    firebaseUrl: s.firebaseUrl || SITE_CONFIG.firebaseUrl || "",
    syncCode: s.syncCode || SITE_CONFIG.syncCode || "",
    adminPin: s.adminPin || ADMIN_PIN_DEFAULT
  };
}
function saveSettings(patch){
  const cur = getSettings();
  const next = Object.assign({}, cur, patch);
  localStorage.setItem("ie_settings", JSON.stringify(next));
  return next;
}

/* ============================= CLOUD SYNC (Firebase RTDB REST) ============================= */
function firebaseBase(){
  const s = getSettings();
  if(!s.firebaseUrl || !s.syncCode) return null;
  return s.firebaseUrl.replace(/\/$/,"") + "/insight-employees/" + s.syncCode;
}
function cloudReady(){ return !!firebaseBase(); }
async function pushToCloud(){
  const base = firebaseBase();
  if(!base) return false;
  state.syncStatus = "syncing"; renderIfAdminSettings();
  try{
    const res = await fetch(base + "/articles.json", { method:"PUT", body: JSON.stringify(state.articles) });
    if(!res.ok) throw new Error("HTTP "+res.status);
    state.syncStatus = "ok";
    renderIfAdminSettings();
    return true;
  }catch(e){
    state.syncStatus = "error"; renderIfAdminSettings();
    return false;
  }
}
async function pullFromCloud(silent){
  const base = firebaseBase();
  if(!base) return false;
  if(!silent){ state.syncStatus = "syncing"; renderIfAdminSettings(); }
  try{
    const res = await fetch(base + "/articles.json");
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      state.articles = data;
      saveArticlesLocal(state.articles);
    }
    state.syncStatus = "ok";
    if(!silent) renderIfAdminSettings();
    render();
    return true;
  }catch(e){
    state.syncStatus = "error";
    if(!silent) renderIfAdminSettings();
    return false;
  }
}
function renderIfAdminSettings(){
  if(state.route === "admin" && state.adminLoggedIn && state.adminView === "settings") render();
}
function genCode(){
  return String(Math.floor(100000 + Math.random()*900000));
}

/* ---- Likes (public, no login needed) ---- */
function getVisitorId(){
  let id = localStorage.getItem("ie_visitor_id");
  if(!id){ id = "v" + Date.now() + Math.random().toString(36).slice(2,8); localStorage.setItem("ie_visitor_id", id); }
  return id;
}
function localLikesStore(){ try{ return JSON.parse(localStorage.getItem("ie_likes_local") || "{}"); }catch(e){ return {}; } }
function saveLocalLikes(obj){ localStorage.setItem("ie_likes_local", JSON.stringify(obj)); }
function localLikedSet(){ try{ return JSON.parse(localStorage.getItem("ie_liked_articles") || "[]"); }catch(e){ return []; } }
function isLikedByMe(articleId){ return localLikedSet().indexOf(articleId) !== -1; }
function setLikedByMe(articleId, liked){
  let arr = localLikedSet();
  if(liked && arr.indexOf(articleId) === -1) arr.push(articleId);
  if(!liked) arr = arr.filter(function(x){ return x !== articleId; });
  localStorage.setItem("ie_liked_articles", JSON.stringify(arr));
}
async function fetchLikeCount(articleId){
  const base = firebaseBase();
  if(!base){
    state.likes[articleId] = localLikesStore()[articleId] || 0;
    return;
  }
  try{
    const res = await fetch(base + "/likes/" + articleId + ".json");
    const data = await res.json();
    state.likes[articleId] = data ? Object.keys(data).length : 0;
  }catch(e){ /* keep previous value */ }
}
async function toggleLike(articleId){
  const liked = isLikedByMe(articleId);
  const base = firebaseBase();
  setLikedByMe(articleId, !liked);
  if(!base){
    const store = localLikesStore();
    store[articleId] = Math.max(0, (store[articleId]||0) + (liked ? -1 : 1));
    saveLocalLikes(store);
    state.likes[articleId] = store[articleId];
    render();
    return;
  }
  const url = base + "/likes/" + articleId + "/" + getVisitorId() + ".json";
  try{
    await fetch(url, { method: liked ? "DELETE" : "PUT", body: liked ? undefined : "true" });
    await fetchLikeCount(articleId);
  }catch(e){ showToast("Gagal memperbarui suka."); }
  render();
}

/* ---- Comments (public, no login needed) ---- */
function localCommentsStore(){ try{ return JSON.parse(localStorage.getItem("ie_comments_local") || "{}"); }catch(e){ return {}; } }
function saveLocalComments(obj){ localStorage.setItem("ie_comments_local", JSON.stringify(obj)); }
function objToSortedArray(obj){
  if(!obj) return [];
  return Object.keys(obj).map(function(k){ const c = Object.assign({}, obj[k]); c._key = k; return c; })
    .sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
}
async function fetchComments(articleId){
  const base = firebaseBase();
  if(!base){
    state.comments[articleId] = objToSortedArray(localCommentsStore()[articleId]);
    return;
  }
  try{
    const res = await fetch(base + "/comments/" + articleId + ".json");
    const data = await res.json();
    state.comments[articleId] = objToSortedArray(data);
  }catch(e){ state.comments[articleId] = state.comments[articleId] || []; }
}
async function submitComment(articleId, name, text){
  const comment = { name: name, text: text, date: new Date().toISOString() };
  const base = firebaseBase();
  if(!base){
    const store = localCommentsStore();
    store[articleId] = store[articleId] || {};
    store[articleId]["c"+Date.now()] = comment;
    saveLocalComments(store);
    state.comments[articleId] = objToSortedArray(store[articleId]);
    render();
    return;
  }
  try{
    await fetch(base + "/comments/" + articleId + ".json", { method:"POST", body: JSON.stringify(comment) });
    await fetchComments(articleId);
  }catch(e){ showToast("Gagal mengirim komentar."); }
  render();
}
async function fetchAllCommentsAdmin(){
  const base = firebaseBase();
  if(!base){
    const store = localCommentsStore();
    let all = [];
    Object.keys(store).forEach(function(aid){
      objToSortedArray(store[aid]).forEach(function(c){ all.push(Object.assign({articleId:aid}, c)); });
    });
    state.allComments = all;
    return;
  }
  try{
    const res = await fetch(base + "/comments.json");
    const data = await res.json();
    let all = [];
    if(data){
      Object.keys(data).forEach(function(aid){
        objToSortedArray(data[aid]).forEach(function(c){ all.push(Object.assign({articleId:aid}, c)); });
      });
    }
    state.allComments = all;
  }catch(e){ state.allComments = state.allComments || []; }
}
async function deleteCommentAdmin(articleId, key){
  const base = firebaseBase();
  if(!base){
    const store = localCommentsStore();
    if(store[articleId]) delete store[articleId][key];
    saveLocalComments(store);
  } else {
    try{ await fetch(base + "/comments/" + articleId + "/" + key + ".json", { method:"DELETE" }); }catch(e){}
  }
  await fetchAllCommentsAdmin();
  render();
  showToast("Komentar dihapus.");
}

/* ---- External sources: YouTube embeds & reference links ---- */
function extractYoutubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function parseYoutubeLines(text){
  return (text||"").split("\n").map(function(l){ return l.trim(); }).filter(Boolean)
    .map(extractYoutubeId).filter(Boolean);
}
function parseReferenceLines(text){
  return (text||"").split("\n").map(function(l){ return l.trim(); }).filter(Boolean)
    .map(function(line){
      const parts = line.split("|");
      const url = parts[0].trim();
      const label = (parts[1]||"").trim() || url;
      return { url:url, label:label };
    });
}

/* ============================= GEMINI AI GENERATION ============================= */
async function generateArticleAI(topic, categoryKey, useSearch){
  const settings = getSettings();
  if(!settings.geminiKey){
    throw new Error("API key Gemini belum diisi. Buka Pengaturan untuk menambahkannya.");
  }
  const catLabel = CATEGORIES[categoryKey] ? CATEGORIES[categoryKey].label : categoryKey;
  const prompt = "Anda adalah jurnalis internal yang menulis artikel wawasan singkat untuk karyawan dan pekerja di seluruh Indonesia, untuk kategori \"" + catLabel + "\". " +
    "Tulis satu artikel tentang topik: \"" + topic + "\". " +
    (useSearch ? "Gunakan hasil pencarian web terbaru untuk memastikan data, contoh, atau angka yang disebut akurat dan aktual. " : "") +
    "Gaya bahasa profesional namun mudah dipahami pekerja lapangan maupun kantor, sertakan tips praktis yang bisa langsung diterapkan, panjang total konten sekitar 350-550 kata, dalam Bahasa Indonesia. " +
    "Balas HANYA dengan JSON valid tanpa markdown, tanpa teks lain, dengan struktur persis: " +
    "{\"title\": \"...\", \"summary\": \"satu kalimat ringkasan menarik\", \"content\": \"isi artikel, paragraf dipisah dengan \\n\\n\"}";

  let lastError = null;
  for(const model of GEMINI_MODELS){
    try{
      const body = { contents:[{ parts:[{ text: prompt }] }] };
      if(useSearch){
        body.tools = model.indexOf("1.5") !== -1 ? [{ google_search_retrieval:{} }] : [{ google_search:{} }];
      }
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-goog-api-key": settings.geminiKey },
        body: JSON.stringify(body)
      });
      if(!res.ok){
        lastError = new Error("Model " + model + " gagal (HTTP " + res.status + ")");
        continue;
      }
      const data = await res.json();
      const parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
      const text = parts ? parts.map(function(p){ return p.text || ""; }).join("") : "";
      if(!text){ lastError = new Error("Model " + model + " tidak mengembalikan teks."); continue; }
      const cleaned = text.replace(/```json/g,"").replace(/```/g,"").trim();
      const parsed = JSON.parse(cleaned);
      if(!parsed.title || !parsed.content) throw new Error("Format JSON tidak lengkap");
      return parsed;
    }catch(e){
      lastError = e;
      continue;
    }
  }
  throw lastError || new Error("Semua model Gemini gagal merespons.");
}

/* ============================= UTIL ============================= */
function escapeHtml(str){
  return String(str == null ? "" : str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function formatDate(iso){
  try{
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("id-ID",{ day:"numeric", month:"long", year:"numeric" });
  }catch(e){ return iso; }
}
function readMinutes(content){
  const words = (content || "").trim().split(/\s+/).length;
  return Math.max(1, Math.round(words / 180));
}
function paragraphsHtml(content){
  return (content || "").split(/\n\s*\n/).map(function(p){
    return "<p>" + escapeHtml(p.trim()) + "</p>";
  }).join("");
}
function legacyContentToHtml(content){
  if(!content) return "";
  return content.split(/\n\s*\n/).map(function(p){
    return "<p>" + escapeHtml(p.trim()) + "</p>";
  }).join("");
}
function sanitizeHtml(html){
  const div = document.createElement("div");
  div.innerHTML = html || "";
  div.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(function(el){ el.remove(); });
  div.querySelectorAll("*").forEach(function(el){
    Array.prototype.slice.call(el.attributes).forEach(function(attr){
      const name = attr.name.toLowerCase();
      if(name.indexOf("on") === 0 || (name === "href" && /^\s*javascript:/i.test(attr.value)) || (name === "src" && /^\s*javascript:/i.test(attr.value))){
        el.removeAttribute(attr.name);
      }
    });
  });
  return div.innerHTML;
}

/* ---- editor toolbar state ---- */
let editorSelectionRange = null;
function saveEditorSelection(){
  const sel = window.getSelection();
  const editor = document.getElementById("f_content_editor");
  if(editor && sel.rangeCount > 0 && editor.contains(sel.anchorNode)){
    editorSelectionRange = sel.getRangeAt(0).cloneRange();
  }
}
function restoreEditorSelection(){
  if(!editorSelectionRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  try{ sel.addRange(editorSelectionRange); }catch(e){}
}
function applyEditorFontSize(px){
  document.execCommand("fontSize", false, "7");
  const editor = document.getElementById("f_content_editor");
  if(!editor) return;
  const marks = editor.querySelectorAll('font[size="7"]');
  marks.forEach(function(f){
    f.removeAttribute("size");
    f.style.fontSize = px + "px";
  });
}
function insertEditorImage(src){
  const editor = document.getElementById("f_content_editor");
  if(!editor) return;
  editor.focus();
  restoreEditorSelection();
  document.execCommand("insertHTML", false, '<img src="' + src + '" alt="">');
}
function handleEditorImageUpload(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ showToast("File harus berupa gambar."); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 1000;
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      insertEditorImage(dataUrl);
    };
    img.onerror = function(){ showToast("Gagal memuat gambar."); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function nextTagCode(articles){
  let max = 0;
  articles.forEach(function(a){
    const m = /TAG-(\d+)/.exec(a.code || "");
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "TAG-" + String(max + 1).padStart(3,"0");
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ legacyCopy(text); });
  } else {
    legacyCopy(text);
  }
}
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

function parseHash(){
  const h = window.location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if(parts[0] === "admin"){
    state.route = "admin";
    state.routeParam = parts[1] || null;
  } else if(parts[0] === "artikel" && parts[1]){
    state.route = "article";
    state.routeParam = parts[1];
  } else if(parts[0] === "kategori" && parts[1]){
    state.route = "category";
    state.routeParam = parts[1];
  } else if(parts[0] === "cari"){
    state.route = "search";
  } else if(parts[0] === "tentang"){
    state.route = "about";
  } else {
    state.route = "home";
  }
}

function render(){
  const app = document.getElementById("app");
  if(state.route === "admin"){
    app.innerHTML = state.adminLoggedIn ? renderAdminShell() : renderAdminGate();
    if(!state.adminLoggedIn){
      const pinInput = document.getElementById("pinInput");
      if(pinInput){
        pinInput.focus();
        pinInput.addEventListener("keydown", function(e){ if(e.key === "Enter") attemptAdminLogin(); });
      }
    }
    return;
  }
  if(state.route === "article"){ app.innerHTML = renderArticleDetail(state.routeParam); return; }
  if(state.route === "category"){
    const label = (CATEGORIES[state.routeParam] || {label:"Kategori"}).label;
    app.innerHTML = renderListPage(label);
    return;
  }
  if(state.route === "search"){ app.innerHTML = renderListPage('Hasil pencarian: "' + state.searchQuery + '"'); return; }
  if(state.route === "about"){ app.innerHTML = renderAbout(); return; }
  app.innerHTML = renderHome();
}

function attemptAdminLogin(){
  const pin = document.getElementById("pinInput").value;
  const settings = getSettings();
  if(pin === settings.adminPin){
    state.adminLoggedIn = true;
    state.adminView = "dashboard";
    render();
  } else {
    document.getElementById("gateError").textContent = "PIN salah. Coba lagi.";
  }
}
function collectFormArticle(){
  const tags = document.getElementById("f_tags").value.split(",").map(function(t){ return t.trim(); }).filter(Boolean);
  const youtube = parseYoutubeLines(document.getElementById("f_youtube").value);
  const references = parseReferenceLines(document.getElementById("f_references").value);
  const editorEl = document.getElementById("f_content_editor");
  const contentHtml = sanitizeHtml(editorEl ? editorEl.innerHTML : "");
  const plainText = editorEl ? (editorEl.textContent || "").trim() : "";
  return {
    title: document.getElementById("f_title").value.trim(),
    category: document.getElementById("f_category").value,
    author: document.getElementById("f_author").value.trim() || "Tim Redaksi",
    summary: document.getElementById("f_summary").value.trim(),
    content: plainText,
    contentHtml: contentHtml,
    tags: tags,
    media: { youtube: youtube },
    references: references
  };
}
function saveArticleFromForm(){
  const data = collectFormArticle();
  if(!data.title || (!data.content && data.contentHtml.replace(/<[^>]*>/g,"").trim() === "" && data.contentHtml.indexOf("<img") === -1)){
    showToast("Judul dan isi artikel wajib diisi.");
    return;
  }
  if(state.editingId){
    const idx = state.articles.findIndex(function(a){ return a.id === state.editingId; });
    if(idx !== -1){
      state.articles[idx] = Object.assign({}, state.articles[idx], data);
    }
    state.editingId = null;
    showToast("Perubahan disimpan.");
  } else {
    const id = "a" + Date.now();
    const code = nextTagCode(state.articles);
    state.articles.push(Object.assign({ id:id, code:code, date:new Date().toISOString().slice(0,10) }, data));
    showToast("Artikel dipublikasikan.");
  }
  saveArticlesLocal(state.articles);
  state.adminView = "dashboard";
  render();
  pushToCloud();
}

document.addEventListener("click", function(e){
  const target = e.target.closest("[data-action]");
  if(!target) return;
  const action = target.getAttribute("data-action");

  if(action === "search-submit"){
    const val = document.getElementById("topSearchInput").value.trim();
    state.searchQuery = val;
    go("#/cari/" + encodeURIComponent(val));
    parseHash(); render();
  }
  else if(action === "admin-login"){ attemptAdminLogin(); }
  else if(action === "admin-logout"){ state.adminLoggedIn = false; render(); go("#/"); }
  else if(action === "admin-nav"){
    state.adminView = target.getAttribute("data-view");
    state.editingId = null;
    if(state.adminView === "comments") state.commentsNeedsFetch = true;
    render();
  }
  else if(action === "admin-refresh-comments"){ state.commentsNeedsFetch = true; render(); }
  else if(action === "admin-delete-comment"){
    const articleId = target.getAttribute("data-article");
    const key = target.getAttribute("data-key");
    if(confirm("Hapus komentar ini?")) deleteCommentAdmin(articleId, key);
  }
  else if(action === "toggle-like"){ toggleLike(target.getAttribute("data-id")); }
  else if(action === "share-native"){
    const url = target.getAttribute("data-url");
    const title = target.getAttribute("data-title");
    if(navigator.share){
      navigator.share({ title:title, url:url }).catch(function(){});
    } else {
      copyToClipboard(url);
      showToast("Link disalin — tempel di Instagram/TikTok kamu.");
    }
  }
  else if(action === "share-copy"){
    copyToClipboard(target.getAttribute("data-url"));
    showToast("Link disalin ke clipboard.");
  }
  else if(action === "admin-edit"){
    state.editingId = target.getAttribute("data-id");
    state.adminView = "new";
    render();
  }
  else if(action === "admin-cancel-edit"){
    state.editingId = null;
    state.adminView = "dashboard";
    render();
  }
  else if(action === "admin-delete"){
    const id = target.getAttribute("data-id");
    if(confirm("Hapus artikel ini? Tindakan ini tidak bisa dibatalkan.")){
      state.articles = state.articles.filter(function(a){ return a.id !== id; });
      saveArticlesLocal(state.articles);
      render();
      pushToCloud();
      showToast("Artikel dihapus.");
    }
  }
  else if(action === "admin-save"){ saveArticleFromForm(); }
  else if(action === "admin-generate-ai"){ runAiGeneration(); }
  else if(action === "save-gemini-key"){
    const val = document.getElementById("s_geminiKey").value.trim();
    saveSettings({ geminiKey: val });
    showToast("API key disimpan.");
  }
  else if(action === "save-firebase-url"){
    const val = document.getElementById("s_firebaseUrl").value.trim();
    saveSettings({ firebaseUrl: val });
    showToast("Firebase URL disimpan.");
  }
  else if(action === "save-pin"){
    const val = document.getElementById("s_pin").value.trim();
    if(val.length < 4){ showToast("PIN minimal 4 digit."); return; }
    saveSettings({ adminPin: val });
    showToast("PIN admin diperbarui.");
    render();
  }
  else if(action === "sync-new-code"){
    const code = genCode();
    saveSettings({ syncCode: code });
    pushToCloud().then(function(){ render(); });
    render();
  }
  else if(action === "sync-join-code"){
    const code = document.getElementById("s_joinCode").value.trim();
    if(!/^\d{4,8}$/.test(code)){ showToast("Masukkan kode yang valid."); return; }
    saveSettings({ syncCode: code });
    pullFromCloud().then(function(ok){
      showToast(ok ? "Berhasil gabung & menarik data." : "Gagal mengambil data. Cek Firebase URL & kode.");
      render();
    });
  }
  else if(action === "sync-push"){ pushToCloud().then(function(ok){ showToast(ok?"Berhasil push ke cloud.":"Gagal push."); }); }
  else if(action === "sync-pull"){ pullFromCloud().then(function(ok){ showToast(ok?"Berhasil tarik dari cloud.":"Gagal menarik data."); }); }
  else if(action === "export-backup"){
    const blob = new Blob([JSON.stringify(state.articles, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "insight-employees-backup.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
});

    reader.onload = function(){
      try{
        const data = JSON.parse(reader.result);
        if(Array.isArray(data)){
          state.articles = data;
          saveArticlesLocal(state.articles);
          showToast("Backup berhasil dipulihkan.");
          render();
        } else {
          showToast("File tidak valid.");
        }
      }catch(err){ showToast("Gagal membaca file."); }
    };
    reader.readAsText(file);
  }
});

async function runAiGeneration(){
  const topic = document.getElementById("ai_topic").value.trim();
  const category = document.getElementById("ai_category").value;
  const useSearch = document.getElementById("ai_use_search").checked;
  if(!topic){ showToast("Isi topik terlebih dahulu."); return; }
  const btn = document.getElementById("aiGenerateBtn");
  const statusEl = document.getElementById("aiStatus");
  btn.setAttribute("disabled","disabled");
  btn.innerHTML = '<span class="spin"></span> Generating...';
  statusEl.textContent = useSearch ? "Meriset & menulis dengan Google Search..." : "Menghubungi Gemini...";
  try{
    const result = await generateArticleAI(topic, category, useSearch);
    const id = "a" + Date.now();
    const code = nextTagCode(state.articles);
    const article = {
      id:id, code:code, category:category,
      title: result.title, summary: result.summary || "", content: result.content,
      author:"AI Draft · Tim Redaksi", date:new Date().toISOString().slice(0,10), tags:[],
      media:{youtube:[]}, references:[]
    };
    state.articles.push(article);
    saveArticlesLocal(state.articles);
    state.editingId = id;
    state.adminView = "new";
    showToast("Draf artikel dibuat. Periksa & edit sebelum publikasi final.");
    render();
    pushToCloud();
  }catch(err){
    statusEl.textContent = "Gagal: " + err.message;
    btn.removeAttribute("disabled");
    btn.innerHTML = "✨ Generate Artikel";
  }
}

/* ============================= INIT ============================= */
function init(){
  state.articles = loadArticles();
  parseHash();
  render();
  const settings = getSettings();
  if(settings.firebaseUrl && settings.syncCode){
    pullFromCloud(true);
  }
}
init();
</script>
